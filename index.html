<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEILOG - Assistente de Fluxos Rápidos</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tone.js para efeitos sonoros -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>

  <!-- IMask.js para máscaras de formulário -->
  <script src="https://unpkg.com/imask"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --heineken-green: #00904A;
      --heineken-red: #E50025;
      --dark-bg: #174017;
      --text-light: #f3f4f6;
    }
    body { font-family: 'Roboto', sans-serif; background-color: var(--dark-bg); color: var(--text-light); }
    .font-title { font-family: 'Oswald', sans-serif; }
    .transition-all { transition: all 0.3s ease-in-out; }
    .card { background-color: rgba(0, 0, 0, 0.3); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .form-input, .form-select { background-color: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: white; }
    .form-input:focus, .form-select:focus { border-color: var(--heineken-green); box-shadow: 0 0 0 2px rgba(0, 144, 74, 0.5); outline: none; }
    .btn-green { background-color: var(--heineken-green); color: white; font-weight: bold; }
    .btn-green:hover { background-color: #007a3f; }
    .btn-ghost { background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,255,255,0.12); font-weight: 700; }
    .btn-ghost:hover { background: rgba(255,255,255,0.14); }
    .btn-danger { background-color: var(--heineken-red); color: white; font-weight: bold; }
    .btn-danger:hover { background-color: #c6001f; }
    .form-input.invalid { border-color: var(--heineken-red); box-shadow: 0 0 0 2px rgba(229, 0, 37, 0.5); }

    #call-panel-overlay { position: fixed; inset: 0; background-color: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    #call-panel-content { padding: 3rem; border-radius: 1rem; text-align: center; color: #1a202c; animation: fadeIn 0.3s ease-out; }

    /* Popup de confirmação das placas */
    #plate-confirm-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0,0,0,0.82);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1100;
      padding: 1rem;
    }

    #plate-confirm-modal {
      width: 100%;
      max-width: 520px;
      border-radius: 22px;
    }

    .plate-line {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      padding: 12px 14px;
    }

    .plate-line .label {
      font-size: 0.85rem;
      opacity: 0.8;
      margin-bottom: 4px;
    }

    .plate-line .value {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .plate-line.manobra-plate-line {
      background: rgba(245, 158, 11, 0.18);
      border-color: rgba(245, 158, 11, 0.62);
      box-shadow: inset 0 0 0 1px rgba(251, 191, 36, 0.08);
    }

    .plate-line.manobra-plate-line .label {
      color: #fef3c7;
      opacity: 1;
    }

    .plate-line.manobra-plate-line .value input {
      border-color: rgba(251, 191, 36, 0.65);
      background: rgba(146, 64, 14, 0.24);
    }


    /* Checklist impresso após a marcação */
    .print-page-break {
      break-before: page;
      page-break-before: always;
      height: 0;
    }

    .checklist-page {
      background: #fff;
      color: #000;
      padding: 8px;
      font-family: Arial, sans-serif;
      font-size: 10px;
      line-height: 1.15;
    }

    .checklist-title {
      text-align: center;
      font-weight: 900;
      font-size: 18px;
      margin-bottom: 4px;
      letter-spacing: 0.04em;
    }

    .checklist-subtitle {
      text-align: center;
      font-size: 10px;
      margin-bottom: 8px;
    }

    .checklist-meta {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 8px;
      table-layout: fixed;
    }

    .checklist-meta td {
      border: 1px solid #000;
      padding: 4px 5px;
      vertical-align: top;
      word-wrap: break-word;
    }

    .checklist-section-title {
      background: #e5e7eb;
      border: 1px solid #000;
      font-weight: 900;
      padding: 4px 6px;
      margin-top: 6px;
      margin-bottom: 0;
      text-transform: uppercase;
    }

    .checklist-hint {
      border: 1px solid #000;
      border-top: 0;
      padding: 4px 6px;
      font-size: 9px;
      background: #fafafa;
    }

    .checklist-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      margin-bottom: 6px;
    }

    .checklist-table th,
    .checklist-table td {
      border: 1px solid #000;
      padding: 3px 4px;
      vertical-align: middle;
    }

    .checklist-table th {
      background: #f3f4f6;
      font-weight: 900;
    }

    .checklist-table .n-col {
      width: 26px;
      text-align: center;
      font-weight: 700;
    }

    .checklist-table .check-col {
      width: 34px;
      text-align: center;
      font-weight: 900;
      font-size: 12px;
    }

    .checklist-table .obs-col {
      width: 86px;
    }

    .check-inline {
      display: inline-block;
      margin-right: 14px;
      margin-bottom: 3px;
      font-weight: 700;
    }

    .checklist-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .checklist-signature-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
      margin-bottom: 6px;
    }

    .checklist-signature-box {
      border: 1px solid #000;
      min-height: 46px;
      padding: 4px 6px;
    }

    .checklist-signature-box .sig-label {
      font-weight: 700;
      margin-bottom: 16px;
    }

    .checklist-footer {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
      font-size: 9px;
      font-weight: 700;
    }

    .checklist-priority-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 8px;
      font-size: 9px;
      font-weight: 900;
      text-align: center;
    }

    .checklist-priority-row div {
      border: 1px solid #000;
      padding: 4px;
      background: #f9fafb;
    }


    /* Checklist impresso - modelo espelhado do XLSM */
    .xl-check-page {
      background: #fff;
      color: #000;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 9.6px;
      line-height: 1.1;
      padding: 0;
    }

    .xl-check-wrap {
      border: 1px solid #000;
      width: 100%;
    }

    .xl-check-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .xl-check-table td,
    .xl-check-table th {
      border: 1px solid #000;
      padding: 2px 3px;
      vertical-align: middle;
      word-wrap: break-word;
    }

    .xl-center { text-align: center; }
    .xl-right { text-align: right; }
    .xl-bold { font-weight: 700; }
    .xl-heavy { font-weight: 900; }
    .xl-small { font-size: 9.4px; }
    .xl-xsmall { font-size: 8.1px; }
    .xl-red { color: #d90000; font-weight: 700; }
    .xl-green-header { background: #d8e4bc; font-weight: 700; text-align: center; }
    .xl-gray-header { background: #efefef; font-weight: 900; text-align: center; }
    .xl-section-title {
      border-top: 1px solid #000;
      border-bottom: 1px solid #000;
      background: #efefef;
      text-align: center;
      font-weight: 900;
      font-size: 10.8px;
      padding: 2px 4px;
      text-transform: uppercase;
    }

    .xl-header-grid {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .xl-header-grid td {
      border: 1px solid #000;
      padding: 0;
      vertical-align: middle;
    }

    .xl-header-brand {
      padding: 4px 10px !important;
      height: 58px;
      background: #fff;
    }

    .xl-brand-flex {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .xl-brand-logo {
      display: block;
      width: 100%;
      max-width: 390px;
      height: 50px;
      background-repeat: no-repeat;
      background-position: left center;
      background-size: contain;
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }

    .xl-header-title {
      text-align: center;
      font-weight: 900;
      font-size: 14.5px;
      letter-spacing: 0.01em;
      padding: 0 6px !important;
    }

    .xl-header-datetime {
      font-size: 9.2px;
      font-weight: 700;
      width: 138px;
    }

    .xl-under-row {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .xl-line {
      display: inline-block;
      border-bottom: 1px solid #000;
      min-width: 76px;
      height: 10px;
      padding: 0 2px;
      vertical-align: bottom;
      font-weight: 700;
    }

    .xl-line.sm { min-width: 60px; }
    .xl-line.md { min-width: 92px; }
    .xl-line.lg { min-width: 120px; }
    .xl-line.xl { min-width: 180px; }

    .xl-check-inline {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      margin: 0 6px 0 0;
      white-space: nowrap;
      font-weight: 700;
    }

    .xl-box {
      display: inline-block;
      width: 16px;
      height: 11px;
      border: 1px solid #000;
      line-height: 11px;
      text-align: center;
      font-weight: 900;
      font-size: 8px;
    }

    .xl-box.big {
      width: 12px;
      height: 12px;
      line-height: 12px;
    }

    .xl-transport {
      padding: 5px 8px 4px;
    }

    .xl-transport-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .xl-transport-row.center-tight { gap: 12px; }
    .xl-check-groups {
      text-align: center;
      padding: 5px 8px 4px;
    }

    .xl-group-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .xl-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 3px 5px 4px;
    }

    .xl-question-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 7px;
    }

    .xl-question-table td,
    .xl-question-table th {
      border: 1px solid #000;
      padding: 1px 2px;
      vertical-align: middle;
    }

    .xl-qtext { width: auto; font-weight: 700; }
    .xl-yn { width: 28px; text-align: center; }
    .xl-yncell { height: 17px; text-align: center; }

    .xl-comments-box {
      border: 1px solid #000;
      min-height: 52px;
      margin-top: 6px;
      padding: 3px 5px;
    }

    .xl-comments-title {
      text-align: center;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .xl-decision-row {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      align-items: center;
    }

    .xl-decision-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }

    .xl-sign-stack {
      padding: 16px 14px 0;
      font-size: 9px;
    }

    .xl-sign-line {
      margin-bottom: 10px;
      white-space: nowrap;
      font-weight: 700;
    }

    .xl-sign-line .xl-line {
      min-width: 120px;
    }

    .xl-sign-line.small-gap { margin-bottom: 6px; }

    .xl-important-red {
      color: #d90000;
      font-weight: 700;
      text-align: left;
      padding: 3px 6px 1px;
      font-size: 6px;
      line-height: 1.1;
    }

    .xl-split-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 3px 5px 4px;
    }

    .xl-subhead {
      border: 1px solid #000;
      border-bottom: 0;
      background: #d8e4bc;
      text-align: center;
      font-weight: 900;
      font-size: 8px;
      padding: 2px 3px;
    }

    .xl-subhead.red {
      color: #d90000;
    }

    .xl-bottom-area {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 6px;
      padding: 4px 3px 1px;
    }

    .xl-doc-meta {
      text-align: right;
      font-size: 6px;
      line-height: 1.1;
      min-width: 100px;
    }

    .xl-priorities {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 18px;
      padding: 6px 2px 1px;
      font-size: 9px;
      font-weight: 900;
    }

    .xl-priority-item {
      display: flex;
      align-items: flex-end;
      gap: 0;
      flex: 1 1 0;
      white-space: nowrap;
      font-size: 9px;
    }

    .xl-priority-item .xl-line {
      flex: 1 1 auto;
      min-width: 140px;
      margin-left: 2px;
      height: 11px;
    }

    .xl-check-page,
    .xl-check-wrap {
      page-break-inside: avoid;
      break-inside: avoid-page;
    }

    @media print {
      .xl-check-page {
        font-size: 7.8px;
        zoom: 0.89;
      }
      .xl-header-title { font-size: 13px; }
      .xl-section-title { font-size: 9.6px; }
      .xl-priorities { gap: 24px; }
      .xl-brand-logo { height: 44px; }
    }


    @media print {
      @page {
        size: A4 portrait;
        margin: 6mm;
      }

      .checklist-page {
        padding: 0;
        font-size: 8px;
      }

      .checklist-table th,
      .checklist-table td,
      .checklist-meta td,
      .checklist-signature-box,
      .checklist-section-title,
      .checklist-hint {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }

    /* ✅ NÃO MOSTRAR A FOLHA NA TELA (só no print) */
    #printable-area { position: fixed; left: -10000px; top: 0; width: 100%; }

    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
      .print-main-container { border: 4px solid black !important; padding: 0.75rem; color: black !important; }
      #app-container, #call-panel-overlay, #plate-confirm-overlay { display: none !important; }
    }

    /* Menu tiles (modo inicial) - mantido mas não usado no modo simplificado */
    .mode-tile { min-height: 74px; }
    .mode-tile .emoji { font-size: 26px; line-height: 1; }
    .mode-tile .label { font-size: 0.98rem; }

    /* Alto contraste (somente nas opções) */
    .hc .mode-btn {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.25);
    }
    .hc .mode-btn:hover { background: rgba(255,255,255,0.18); }
    .hc .mode-btn:focus { outline: 2px solid rgba(0, 144, 74, 0.65); outline-offset: 2px; }

    /* ===== UI SIMPLIFICADA (CAMINHONEIRO) ===== */
    .simple-ui .card { border-radius: 22px; }
    .simple-ui .big-title { font-size: 1.35rem; font-weight: 800; }
    .simple-ui .help { color: rgba(243,244,246,0.85); font-size: 0.95rem; line-height: 1.25rem; }

    .simple-ui .btn-xl {
      width: 100%;
      padding: 18px 16px;
      border-radius: 18px;
      font-weight: 900;
      font-size: 1.15rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .simple-ui .btn-xl .left { display: flex; align-items: center; gap: 12px; }
    .simple-ui .btn-xl .emoji { font-size: 28px; }
    .simple-ui .btn-xl .desc { font-size: 0.85rem; font-weight: 600; opacity: .85; margin-top: 2px; }

    .simple-ui .input-xl, .simple-ui .select-xl {
      width: 100%;
      padding: 16px 14px;
      border-radius: 16px;
      font-size: 1.05rem;
    }

    .simple-ui .section {
      background: rgba(0,0,0,0.20);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      padding: 14px;
    }

    .simple-ui details summary {
      cursor: pointer;
      user-select: none;
      font-weight: 800;
    }
    .simple-ui details summary::marker { font-size: 1.1em; }

    .simple-ui .sticky-actions {
      position: sticky;
      bottom: 0;
      background: linear-gradient(to top, rgba(23,64,23,1), rgba(23,64,23,0.75));
      padding-top: 12px;
    }

    .simple-ui .badge {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 900;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .simple-ui .step {
      font-size: 0.9rem;
      font-weight: 900;
      opacity: .9;
      margin-bottom: 8px;
    }

    .simple-ui .divider { height:1px; background: rgba(255,255,255,0.10); margin: 12px 0; }

    .desktop-shell {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      align-items: start;
    }

    .workspace-card {
      width: 100%;
      min-height: min(860px, calc(100vh - 32px));
      padding: 22px;
    }

    .workspace-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .topbar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 4px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-block {
      min-width: 0;
    }

    .system-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      color: #f3f4f6;
      font-size: 0.9rem;
      font-weight: 700;
      max-width: 100%;
    }

    .system-pill .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #facc15;
      display: inline-block;
      flex: 0 0 auto;
    }

    .system-pill .status-text {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .simple-ui .progress-wrap {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 2px;
    }

    .simple-ui .progress-step {
      flex: 1 1 120px;
      min-width: 0;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.04);
      padding: 10px 12px;
    }

    .simple-ui .progress-step .kicker {
      display: block;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: .06em;
      opacity: .75;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .simple-ui .progress-step.active {
      background: rgba(0, 144, 74, 0.16);
      border-color: rgba(0, 144, 74, 0.45);
      box-shadow: 0 0 0 1px rgba(0, 144, 74, 0.2) inset;
    }

    .simple-ui .progress-step.done {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.18);
    }

    .simple-ui .flow-group {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .simple-ui .flow-group-title {
      font-weight: 900;
      font-size: 0.95rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .simple-ui .flow-group-subtitle {
      display: none;
    }

    .simple-ui .summary-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .simple-ui .summary-item {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      padding: 10px 12px;
    }

    .simple-ui .summary-item .label {
      font-size: 0.8rem;
      opacity: .76;
      margin-bottom: 4px;
    }

    .simple-ui .summary-item .value {
      font-size: 1rem;
      font-weight: 900;
      line-height: 1.2;
      word-break: break-word;
    }

    .simple-ui .form-hint-box {
      border-radius: 16px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .simple-ui .compact-note {

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

    ];
    const FETCH_TIMEOUT_MS = 15000;
    const REFRESH_INTERVAL = 300000; // 5 min

    // --- DOM ---
    const fileStatus = document.getElementById('file-status');
    const resultsArea = document.getElementById('results-area');

    const callPanelMessage = document.getElementById('call-panel-message');
    const closePanelBtn = document.getElementById('close-panel-btn');
    const returnInitialFloatingBtn = document.getElementById('return-initial-floating');

    // --- Estado ---
    let db, auth, appId;
    let isAuthReady = false;
    let database = [];
    let headers = [];
    const DEFAULT_HEADER_MAP = {
      dts: 'DTS',
      canal: 'CANAL',
      cliente: 'CLIENTE',

    };

    let headerMap = { ...DEFAULT_HEADER_MAP };

    function ensureHeaderMapDefaults() {
      headerMap = { ...DEFAULT_HEADER_MAP, ...(headerMap || {}) };
      Object.keys(DEFAULT_HEADER_MAP).forEach((key) => {
        if (!headerMap[key]) headerMap[key] = DEFAULT_HEADER_MAP[key];
      });

    }
    let panelTimeout;

    // Fluxos

    let isSheetReady = false;

    let loadAlsoUnload = false; // Carregar: também vai descarregar?

    // Sessão (CPF único por acesso)
    let sessionCpf = '';
    let sessionDriver = null;
    let postIntegrationNavigate = null;

    // Transportadora preset (para fluxos específicos)
    let presetTransportadora = '';
    let lockTransportadora = false;

    // Registro detalhado do fluxo escolhido
    let selectedFlowKey = '';
    let selectedFlowLabel = '';
    let selectedFlowStep1 = '';
    let selectedFlowStep2 = '';

    // Baldeio: DTs opcionais
    let baldeioDtCarga = '';
    let baldeioDtDescarga = '';

    // Drop & Hook: motorista manobra marca primeiro, informa o motorista viagem e escolhe se terá retorno/descarga
    let isDropHookFlow = false;
    let dropHookTripCpf = '';
    let dropHookTripDriver = null;
    let dropHookDtCarga = '';
    let dropHookManeuverCpf = '';
    let dropHookManeuverDriver = null;
    let dropHookManeuverPlate = '';
    let dropHookAlsoUnload = false;
    let dropHookQuickMode = false;
    let baldeioQuickMode = false;

    function isQuickPlateMode() {
      return dropHookQuickMode || baldeioQuickMode;
    }

    function normalizeCarrierName(value = '') {
      return (value || '')
        .toString()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toUpperCase()
        .replace(/[^A-Z0-9]+/g, ' ')
        .trim();
    }

    function isRitmoOrJslDriver(driver = sessionDriver) {
      if (!driver) return false;
      const carrier = normalizeCarrierName(driver.transportadora || '');
      return carrier.includes('RITMO') || /(^|\s)JSL($|\s)/.test(carrier);
    }

    function isDropDriverAuthorized(driver = sessionDriver) {
      return !!driver && isRitmoOrJslDriver(driver) && (
        driver.dropAutorizado === true ||
        driver.motoristaDrop === true ||
        driver.dropHookAutorizado === true
      );
    }

    function isRitmoDriverAuthorized(driver = sessionDriver) {
      return !!driver && (
        driver.baldeioRitmoAutorizado === true ||
        driver.motoristaRitmo === true ||
        driver.ritmoBaldeioAutorizado === true
      );
    }

    function resetAttendanceStateForInitialScreen() {
      currentMode = null;
      pendingUnloadDt = '';
      requireUnloadDtInForm = false;
      manualPresetType = '';
      manualDtIdOverride = '';
      hideManualExtras = false;
      showUnloadInputs = true;
      loadAlsoUnload = false;
      sessionCpf = '';
      sessionDriver = null;
      postIntegrationNavigate = null;
      presetTransportadora = '';
      lockTransportadora = false;
      selectedFlowKey = '';
      selectedFlowLabel = '';
      selectedFlowStep1 = '';
      selectedFlowStep2 = '';
      baldeioDtCarga = '';
      baldeioDtDescarga = '';
      isDropHookFlow = false;
      dropHookTripCpf = '';
      dropHookTripDriver = null;
      dropHookDtCarga = '';
      dropHookManeuverCpf = '';
      dropHookManeuverDriver = null;
      dropHookManeuverPlate = '';
      dropHookAlsoUnload = false;
      dropHookQuickMode = false;
      baldeioQuickMode = false;
    }

    function updateReturnInitialButtonVisibility() {
      if (!returnInitialFloatingBtn) return;
      const isInitialGate = !!document.getElementById('gate-cpf');
      const hasVisibleFlowContent = !!(
        (actionArea?.textContent || '').trim() ||
        (resultsArea?.textContent || '').trim()
      );
      returnInitialFloatingBtn.classList.toggle('hidden', isInitialGate || !hasVisibleFlowContent);
    }

    function returnToInitialScreen(confirmReturn = true) {
      if (confirmReturn) {
        const ok = window.confirm('Deseja desistir deste atendimento e voltar para a tela inicial?');
        if (!ok) return;
      }

      try { document.getElementById('plate-confirm-overlay').style.display = 'none'; } catch {}
      try { callPanelOverlay.style.display = 'none'; } catch {}
      try { clearTimeout(panelTimeout); } catch {}

      resetAttendanceStateForInitialScreen();
      resultsArea.innerHTML = '';
      actionArea.innerHTML = '';
      fileStatus.textContent = isSheetReady ? 'Atendimento reiniciado.' : 'Atendimento reiniciado. Aguardando planilha...';
      renderCpfGate();
      updateReturnInitialButtonVisibility();
      try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch { try { window.scrollTo(0, 0); } catch {} }
    }

    returnInitialFloatingBtn?.addEventListener('click', () => returnToInitialScreen(true));

    const returnInitialObserver = new MutationObserver(() => {
      window.requestAnimationFrame(updateReturnInitialButtonVisibility);
    });
    returnInitialObserver.observe(actionArea, { childList: true, subtree: true });
    returnInitialObserver.observe(resultsArea, { childList: true, subtree: true });

    // --- Integração (Teste a cada 3 meses) ---
    const INTEGRATION_MIN_SCORE = 8;
    const INTEGRATION_VALID_DAYS = 90;  // ~3 meses
    const INTEGRATION_WARN_DAYS = 7;    // aviso 1 semana antes
    const integrationQuestions = [
      { q: "Quais EPIs são obrigatórios para circular na área operacional?", options: ["Nenhum","Capacete, óculos, colete refletivo e calçado de segurança","Somente luvas"], correctIndex: 1 },
      { q: "Sobre adornos (anel, relógio, corrente) na área operacional:", options: ["É permitido se estiver coberto pela roupa","É proibido","É permitido somente relógio"], correctIndex: 1 },
      { q: "Qual é a regra de distância mínima entre pessoas e empilhadeiras?", options: ["1 metro","3 metros","5 metros"], correctIndex: 2 },

      { q: "Em caso de dúvida ou risco, o motorista deve:", options: ["Continuar e depois perguntar","Parar e solicitar orientação ao responsável/segurança","Acelerar para sair da área"], correctIndex: 1 },
      { q: "Antes de entrar na área operacional, o motorista deve:", options: ["Colocar os EPIs e seguir as sinalizações","Somente apresentar a CNH","Somente informar a placa do veículo"], correctIndex: 0 },

      { q: "Se ocorrer um acidente ou quase-acidente, o correto é:", options: ["Não comunicar para evitar atrasos","Comunicar imediatamente ao responsável/segurança","Somente comunicar se houver dano"], correctIndex: 1 }
    ];

    // --- Helpers ---
    function normalizeDigits(v) { return String(v || '').replace(/\D/g, ''); }
    function normalizeDtId(dt) { return normalizeDigits(dt); }

    function generateInternalId(prefix) {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const id = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
      return `${prefix}_${id}`;
    }

      selectedFlowKey = key || '';
      selectedFlowLabel = label || '';
      selectedFlowStep1 = step1 || '';
      selectedFlowStep2 = step2 || '';
    }

    async function registerFlowClick(extra = {}) {
      if (!isAuthReady || !db || !appId) return;

      try {
        const eventId = generateInternalId('FLOW');
        const cpfDigits =
          normalizeDigits(sessionCpf) ||
          normalizeDigits(document.getElementById('driver-cpf')?.value || '');

        const payload = {
          id: eventId,
          cpf: cpfDigits || '',
          motorista: sessionDriver?.name || '',
          flowKey: extra.flowKey || selectedFlowKey || '',
          flowLabel: extra.flowLabel || selectedFlowLabel || '',
          flowStep1: extra.flowStep1 || selectedFlowStep1 || '',
          flowStep2: extra.flowStep2 || selectedFlowStep2 || '',
          currentMode: (currentMode || '').toString().toUpperCase(),
          loadAlsoUnload: !!(extra.dropHookAlsoUnload ?? dropHookAlsoUnload ?? loadAlsoUnload),
          presetTransportadora: (presetTransportadora || '').toString().trim().toUpperCase(),
          isDrop: !!(extra.isDrop || extra.isDropHook || isDropHookFlow),
          isDropHook: !!(extra.isDropHook || extra.isDrop || isDropHookFlow),
          tipoMarcacao: (extra.isDrop || extra.isDropHook || isDropHookFlow) ? 'DROP' : 'NORMAL',
          dropHookAlsoUnload: !!(extra.dropHookAlsoUnload ?? dropHookAlsoUnload),
          controleIdaRetorno: (extra.isDrop || extra.isDropHook || isDropHookFlow)
            ? ((extra.dropHookAlsoUnload ?? dropHookAlsoUnload) ? 'CARGA_E_DESCARGA' : 'CARGA')

          contabilizarCarga: (extra.isDrop || extra.isDropHook || isDropHookFlow) ? 1 : 0,
          contabilizarDescarga: (extra.isDrop || extra.isDropHook || isDropHookFlow) && (extra.dropHookAlsoUnload ?? dropHookAlsoUnload) ? 1 : 0,
          motoristaManobraCpf: extra.motoristaManobraCpf || dropHookManeuverCpf || '',
          motoristaManobra: extra.motoristaManobra || dropHookManeuverDriver?.name || '',

    function gvizResponseToCsv(response) {

      return [cols, ...rows].map(line => line.map(csvEscapeValue).join(',')).join('\n');

    function loadGoogleSheetViaJsonp(timeoutMs = FETCH_TIMEOUT_MS) {
      return new Promise((resolve, reject) => {
        const callbackName = `heilogSheetCallback_${Date.now()}_${Math.random().toString(36).slice(2)}`;
        const script = document.createElement('script');
        let done = false;

        const cleanup = () => {
          try { delete window[callbackName]; } catch { window[callbackName] = undefined; }
          try { script.remove(); } catch {}
        };

        const timer = setTimeout(() => {
          if (done) return;
          done = true;
          cleanup();
          reject(new Error('Tempo esgotado ao carregar a planilha via JSONP.'));
        }, timeoutMs);

        window[callbackName] = (response) => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          try {
            if (response?.status && response.status !== 'ok') {
              throw new Error(response?.errors?.[0]?.detailed_message || response?.errors?.[0]?.reason || 'Falha na resposta da planilha.');
            }
            resolve(gvizResponseToCsv(response));
          } catch (e) {
            reject(e);
          } finally {
            cleanup();
          }
        };

        script.onerror = () => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          cleanup();
          reject(new Error('Não foi possível carregar a planilha pelo modo sem CORS.'));
        };

        // responseHandler é próprio do Google Visualization e permite carregar como <script>, sem bloqueio CORS.
        script.src = `${GOOGLE_SHEET_GVIZ_URL}?tqx=out:json;responseHandler:${callbackName}&t=${Date.now()}`;
        document.head.appendChild(script);
      });
    }

    function parseCSV(csvText) {
      const cleaned = csvText.replace(/^\uFEFF/, '');
      const lines = cleaned.trim().split(/\r?\n/);
      if (lines.length < 2) return;

      const parseLine = (line) => {
        const values = [];
        const regex = /("([^"]|"")*"|[^,]*)(,|$)/g;
        line.replace(regex, (match, p1) => {
          let value = p1;
          if (value.startsWith('"') && value.endsWith('"')) value = value.slice(1, -1).replace(/""/g, '"');
          values.push(value.trim());
        });
        return values;
      };

      headers = parseLine(lines[0]).map(h => h.toUpperCase().replace(/"/g, ''));

      // Helpers de mapeamento de colunas (robusto)
      const findAll = (...keys) => headers.find(h => keys.every(k => h.includes(k)));
      const findAny = (...keys) => headers.find(h => keys.some(k => h.includes(k)));

      headerMap = {
        dts: headers.find(h => h === 'DTS' || h.includes('DTS') || (h.includes('DT') && !h.includes('DATA') && !h.includes('DESC') && !h.includes('AGEN'))) || headers[0],

        canal: findAny('CANAL') || headers[1],
        cliente: findAny('CLIENTE') || headers[2],

        produto: findAny('PRODUTO', 'TIPO') || headers[3],
        descricao: findAny('DESCR') || headers[4],
        plt: findAny('PLT', 'QUANT', 'QTD') || headers[5],

        deposito: findAny('DEPOS', 'DEST') || headers[6],
        transportadora: findAny('TRANSPORT') || headers[7],

        // Data do agendamento (prioriza colunas com AGEN/AGEND)
        data:
          findAll('DATA', 'AGEN') ||
          findAll('DATA', 'AGEND') ||
          findAll('DATA', 'PROGR') ||
          findAll('DATA', 'SCHED') ||
          findAny('DATA AGENDA', 'DATA AGENDAMENTO') ||
          headers.find(h => h === 'DATA') ||
          findAny('DATA') ||
          headers[8],

        // Hora/Agenda (prioriza colunas com HORA/HORÁRIO + AGEN/AGEND)
        agenda:
          findAll('HORA', 'AGEN') ||
          findAll('HOR', 'AGEN') ||
          findAll('HORARIO', 'AGEN') ||
          findAll('HORÁRIO', 'AGEN') ||
          headers.find(h => h.includes('AGENDA') && !h.includes('DATA')) ||
          headers.find(h => (h.includes('HORA') || h.includes('HOR')) && !h.includes('DATA')) ||
          headers[11],

        // DT/ID de descarga
        descarga: findAny('DESCARG') || headers[9],

        // Segmentação / XT
        xtAdicional: findAny('XT', 'SEGMENT', 'SEGMENTO') || headers[10],

        cpf: headers.find(h => h.includes('CPF')),
        motorista: headers.find(h => h.includes('MOTORISTA')),
      };

      ensureHeaderMapDefaults();
      console.log('[HEILOG] headerMap selecionado:', headerMap);

      database = lines.slice(1).map(line => {
        if (line.trim() === '') return null;
        const values = parseLine(line);
        const entry = {};
        headers.forEach((header, j) => { entry[header] = values[j] || ''; });
        return entry;
      }).filter(Boolean);
    }

    // --- PRIORIDADE ---
    // Matriz operacional oficial (1 = maior prioridade):
    // 1 TOP18 aderente | 2 FOB aderente | 3 Dedicada Vendas aderente
    // 4 Vendas/HUB aderentes | 5 TOP18 não aderente | 6 Dedicada aderente Transf
    // 7 Transf aderente | 8 Dedicada não aderente | 9 FOB não aderente
    // 10 Vendas/HUB não aderentes | 11 Transf não aderente
    function getPriorityInfo(sheetRow) {
      let isPriority = false;
      let isOtif = false;
      let isTop18 = false;
      let isAderente = false;
      let isNonAdherent = false;
      let isAntecipacao = false;
      let isGradeQueimada = false;
      let isAtrasado = false;

      const emptyResult = (statusLabel = 'NORMAL') => ({
        label: 'NORMAL',
        matrixLabel: 'NORMAL',
        code: 'sem_matriz',
        rank: 99,
        level: 99,
        statusLabel,
        isPriority,
        isOtif,
        isTop18,
        isAderente,
        isNonAdherent,
        isAntecipacao,
        isGradeQueimada,
        isAtrasado
      });

      if (!sheetRow) return emptyResult();

      const canal = (sheetRow[headerMap.canal] || '').toString().trim().toUpperCase();
      const dateStr = (sheetRow[headerMap.data] || '').toString().trim();
      const timeStr = (sheetRow[headerMap.agenda] || '').toString().trim();
      const segmento = (sheetRow[headerMap.xtAdicional] || '').toString();
      const cliente = (sheetRow[headerMap.cliente] || '').toString();
      const transportadora = (sheetRow[headerMap.transportadora] || '').toString();
      const deposito = (sheetRow[headerMap.deposito] || '').toString();
      const produto = (sheetRow[headerMap.produto] || '').toString();
      const descricao = (sheetRow[headerMap.descricao] || '').toString();

      const normalizePriorityText = (value) => (value || '')
        .toString()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toUpperCase()
        .replace(/[^A-Z0-9]+/g, '_')
        .replace(/^_+|_+$/g, '');

      const ctx = normalizePriorityText([segmento, cliente, transportadora, deposito, produto, descricao].filter(Boolean).join(' '));
      const segmentoNorm = normalizePriorityText(segmento);
      const clienteNorm = normalizePriorityText(cliente);
      const transpNorm = normalizePriorityText(transportadora);

      const SALES_HUB_CHANNELS = new Set(['Y001', 'Y002', 'Y055']);
      isOtif = SALES_HUB_CHANNELS.has(canal);
      // TOP18 é uma marcação adicional apenas para Vendas/HUB.
      isTop18 = isOtif && (segmentoNorm.includes('TOP18') || segmentoNorm.includes('TOP_18'));

      const extractDateTime = (dStr, tStr) => {
        let d = (dStr || '').toString().trim();
        let t = (tStr || '').toString().trim();

        if (d.includes(' ') && !t) {
          const parts = d.split(' ');
          d = parts[0] || d;
          t = parts[1] || '';
        }

        t = t.replace(/\s+/g, '');
        if (t.toLowerCase().includes('h')) t = t.toLowerCase().replace('h', ':');

        const parseDate = (x) => {
          if (!x) return null;
          if (/^\d{2}\/\d{2}\/\d{4}$/.test(x)) {
            const [dd, mm, yyyy] = x.split('/').map(v => parseInt(v, 10));
            return new Date(yyyy, mm - 1, dd);
          }
          if (/^\d{2}-\d{2}-\d{4}$/.test(x)) {
            const [dd, mm, yyyy] = x.split('-').map(v => parseInt(v, 10));
            return new Date(yyyy, mm - 1, dd);
          }
          if (/^\d{4}-\d{2}-\d{2}$/.test(x)) {
            const [yyyy, mm, dd] = x.split('-').map(v => parseInt(v, 10));
            return new Date(yyyy, mm - 1, dd);
          }
          if (/^\d{4}\/\d{2}\/\d{2}$/.test(x)) {
            const [yyyy, mm, dd] = x.split('/').map(v => parseInt(v, 10));
            return new Date(yyyy, mm - 1, dd);
          }
          const dn = new Date(x);
          return Number.isNaN(dn.getTime()) ? null : dn;
        };

        const baseDate = parseDate(d);
        if (!baseDate) return null;

        let hh = 0, mi = 0, ss = 0;
        if (t && t.includes(':')) {
          const parts = t.split(':');
          hh = parseInt(parts[0], 10);
          mi = parseInt(parts[1] || '0', 10);
          ss = parseInt(parts[2] || '0', 10);
          if ([hh, mi, ss].some(n => Number.isNaN(n))) { hh = 0; mi = 0; ss = 0; }
        } else if (t && /^\d{1,2}$/.test(t)) {
          hh = parseInt(t, 10);
          if (Number.isNaN(hh)) hh = 0;
        }

        return new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), hh, mi, ss);
      };

      const scheduledDateTime = extractDateTime(dateStr, timeStr);
      let statusLabel = 'NO PRAZO';

      if (scheduledDateTime) {
        const now = new Date();
        const today = new Date(now); today.setHours(0, 0, 0, 0);
        const scheduledDay = new Date(scheduledDateTime); scheduledDay.setHours(0, 0, 0, 0);

        if (today.getTime() > scheduledDay.getTime()) {
          isGradeQueimada = true;
          isNonAdherent = true;
          statusLabel = 'GRADE QUEIMADA';
        } else if (today.getTime() === scheduledDay.getTime()) {
          const diffMs = now.getTime() - scheduledDateTime.getTime();
          if (diffMs > (60 * 60 * 1000)) {
            isAtrasado = true;
            isNonAdherent = true;
            statusLabel = 'PERDA DE AGENDA';
          } else {
            const plannedHour = scheduledDateTime.getHours();
            if ([21, 22, 23].includes(plannedHour) && now.getTime() < scheduledDateTime.getTime()) {
              isAntecipacao = true;
              statusLabel = 'ANTECIPAÇÃO';
            }
          }
        }
      } else {
        // Sem agenda não há como afirmar aderência. Mantém fora da matriz para não inventar prioridade.
        return emptyResult('SEM AGENDA');
      }

      isAderente = !isNonAdherent;

      // Y006 pode representar Transferência ou Dedicada. O contexto da DT define o perfil.
      const explicitDedicated = ctx.includes('DEDICAD');
      const explicitTransfer = ctx.includes('TRANSF') || ctx.includes('TRANSFER');
      const explicitSales = ctx.includes('VENDA') || ctx.includes('SALES');
      const internalClient = clienteNorm.includes('HNK_BR') || clienteNorm.includes('HEINEKEN_BRASIL') || clienteNorm.includes('INDUSTRIA_DE_BEBIDAS');
      const dedicated = explicitDedicated || transpNorm.includes('JSL');
      const sales = explicitSales || (dedicated && !explicitTransfer && !internalClient);

      const make = (rank, code, label) => ({
        label,
        matrixLabel: label,
        code,
        rank,
        level: rank,
        statusLabel,
        isPriority: true,
        isOtif,
        isTop18,
        isAderente,
        isNonAdherent,
        isAntecipacao,
        isGradeQueimada,
        isAtrasado,
        isDedicated: dedicated,
        isSales: sales,
        isTransfer: canal === 'Y006' && !sales
      });

      // 1 e 5 — TOP18 (sempre acima das demais classificações do mesmo grupo).
      if (isTop18) {
        return isAderente
          ? make(1, 'top18_aderente', 'TOP18 aderente')
          : make(5, 'top18_nao_aderente', 'TOP18 não aderente');
      }

      // 2 e 9 — Y004 = FOB.
      if (canal === 'Y004') {
        return isAderente
          ? make(2, 'fob_aderente', 'FOB aderente')
          : make(9, 'fob_nao_aderente', 'FOB não aderente');
      }

      // 3, 6, 7, 8 e 11 — Y006 = Dedicada/Transferência.
      if (canal === 'Y006') {
        if (isAderente && dedicated && sales) return make(3, 'dedicada_vendas_aderente', 'Dedicada Vendas aderente');
        if (isAderente && dedicated) return make(6, 'dedicada_transf_aderente', 'Dedicada aderente Transf');
        if (isAderente) return make(7, 'transf_aderente', 'Transf aderente');
        if (dedicated) return make(8, 'dedicada_nao_aderente', 'Dedicada não aderente');
        return make(11, 'transf_nao_aderente', 'Transf não aderente');
      }

      // 4 e 10 — Y001/Y002 = Vendas | Y055 = HUB.
      if (SALES_HUB_CHANNELS.has(canal)) {
        return isAderente
          ? make(4, 'vendas_hub_aderentes', 'Vendas/HUB aderentes')
          : make(10, 'vendas_hub_nao_aderentes', 'Vendas/HUB não aderentes');
      }

      return emptyResult(statusLabel);
    }

    // --- Operação/Movimento (para salvar no Firestore) ---
    function toTitleCase(s) {
      return (s || '').toString().toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
    }

    function computeTransportOperationLabel() {
      const mode = (currentMode || '').toString().trim().toUpperCase();
      const presetType = (manualPresetType || '').toString().trim();
      const presetTypeUp = presetType.toUpperCase();
      const transp = (presetTransportadora || '').toString().trim().toUpperCase();

      const unloadMap = {
        'LATAS VAZIAS': 'Descarga de Latas',
        'BULK': 'Descarga de Bulk',
        'PALETES VAZIO': 'Descarga de Paletes',
        'PALETES VAZIOS': 'Descarga de Paletes',
        'PALETES': 'Descarga de Paletes',
        'VASILHAMES': 'Descarga de Vasilhames',
        'PRODUTO ACABADO': 'Descarga de Produto Acabado',
        'INSUMO': 'Descarga de Insumo',
      };

      if (mode === 'DROP_HOOK' || isDropHookFlow) {
        return 'Drop & Hook';
      }

      if (mode === 'LOAD') {
        return loadAlsoUnload ? 'Carga e Descarga' : 'Carregamento';
      }

      if (mode === 'UNLOAD') {
        if (unloadMap[presetTypeUp]) return unloadMap[presetTypeUp];
        if (presetTypeUp) return `Descarga de ${toTitleCase(presetTypeUp)}`;
        return 'Descarga';
      }

      if (mode === 'RITMO') {
        const base = transp ? `Baldeio - ${transp}` : 'Baldeio';
        if (baldeioQuickMode) return `${base} - ${loadAlsoUnload ? 'Carga e Descarga' : 'Carga'}`;
        return base;
      }

      if (mode === 'HIDROMAN') return 'Hidroman';
      if (mode === 'INTEGRACAO') return 'Integração';

      if (presetTypeUp) {
        if (unloadMap[presetTypeUp]) return unloadMap[presetTypeUp];
        if (presetTypeUp === 'BALDEIO') return transp ? `Baldeio - ${transp}` : 'Baldeio';
        if (presetTypeUp === 'HIDROMAN') return 'Hidroman';
      }

      return 'Operação';
    }

    async function findAndFillDriverData(event) {
      const cpfInput = event.target;
      const unmaskedCpf = normalizeDigits(cpfInput.value);
      if (unmaskedCpf.length !== 11) return;
      if (!isAuthReady) return;

      const driverRef = doc(db, 'artifacts', appId, 'public', 'data', 'drivers', unmaskedCpf);
      try {
        const docSnap = await getDoc(driverRef);
        if (docSnap.exists()) {
          fillFormFields(docSnap.data());
        } else {
          const localData = localStorage.getItem(`heilo-driver-${unmaskedCpf}`);
          if (localData) fillFormFields(JSON.parse(localData));
        }
      } catch (error) {
        console.error("Erro ao buscar motorista no Firebase:", error);
        displayError("Erro ao consultar o banco de dados de motoristas.", 4000);
      }
    }

    async function loadDriverByCpf(cpfDigits) {
      const cpf = normalizeDigits(cpfDigits);
      if (cpf.length !== 11 || !db) return null;

      try {
        const ref = doc(db, 'artifacts', appId, 'public', 'data', 'drivers', cpf);
        const snap = await getDoc(ref);
        if (snap.exists()) return snap.data();
      } catch (e) {
        console.warn("Falha ao buscar motorista no Firestore:", e);
      }

      try {
        const cached = localStorage.getItem(`heilo-driver-${cpf}`);
        if (cached) return JSON.parse(cached);
      } catch {}
      return null;
    }

    async function saveDriverOnly(driverData) {
      if (!isAuthReady || !db || !appId) return false;
      const unmaskedCpf = normalizeDigits(driverData.cpf);
      if (unmaskedCpf.length !== 11) return false;

      try {
        const driverDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'drivers', unmaskedCpf);
        const payload = {
          name: driverData.name || '',
          cpf: unmaskedCpf,
          phone: normalizeDigits(driverData.phone || ''),
          cnh: driverData.cnh || '',
          cnhExpiry: driverData.cnhExpiry || '',

        await startIntegrationFlow(cpfMasked, { autoStartTest: true });

      document.getElementById('gate-go')?.addEventListener('click', go);
      cpfEl?.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
      cpfEl?.focus();

      plateEl?.addEventListener('input', (e) => e.target.value = sanitizePlate(e.target.value));
      trailerEl?.addEventListener('input', (e) => e.target.value = sanitizePlate(e.target.value));

      if (sessionDriver) {
        document.getElementById('reg-name').value = sessionDriver.name || '';
        if (phoneEl && sessionDriver.phone) phoneEl.value = sessionDriver.phone;
        document.getElementById('reg-transp').value = sessionDriver.transportadora || '';
        document.getElementById('reg-cnh').value = sessionDriver.cnh || '';
        if (plateEl) plateEl.value = sanitizePlate(sessionDriver.truckPlate || '');
        if (trailerEl) trailerEl.value = sanitizePlate(sessionDriver.trailerPlate || '');
        document.getElementById('reg-axles').value = sessionDriver.axles || '';
      }

      document.getElementById('reg-back')?.addEventListener('click', () => {
        renderCpfGate();
      });

      document.getElementById('reg-save')?.addEventListener('click', async () => {
        await unlockAudio();
        const cpf = normalizeDigits(cpfMasked);
        const name = (document.getElementById('reg-name')?.value || '').trim();
        const phone = (document.getElementById('reg-phone')?.value || '').trim();
        const transp = (document.getElementById('reg-transp')?.value || '').trim();
        const cnh = (document.getElementById('reg-cnh')?.value || '').trim();
        const plate = (document.getElementById('reg-plate')?.value || '').trim().toUpperCase();

        if (!name) return displayError('Nome é obrigatório.', 5000, { field: document.getElementById('reg-name') });
        if (normalizeDigits(phone).length < 10) return displayError('Telefone é obrigatório.', 5000, { field: document.getElementById('reg-phone') });
        if (!isValidCnh(cnh)) return displayError('CNH inválida.', 5000, { field: document.getElementById('reg-cnh') });
        if (!isValidBrazilianPlate(plate)) return displayError('Placa do cavalo é obrigatória.', 5000, { field: document.getElementById('reg-plate') });

        const payload = {
          cpf,
          name,
          phone,
          transportadora: transp,
          cnh,
          truckPlate: sanitizePlate(plate),
          trailerPlate: sanitizePlate((document.getElementById('reg-trailer')?.value || '').trim()),
          axles: (document.getElementById('reg-axles')?.value || ''),
        };

        fileStatus.textContent = 'Salvando cadastro...';
        const ok = await saveDriverOnly(payload);
        if (!ok) return displayError('Não consegui salvar o cadastro. Verifique a conexão.', 5000);

        sessionCpf = cpf;
        sessionDriver = payload;

        fileStatus.textContent = 'Cadastro salvo. Iniciando integração...';
        postIntegrationNavigate = () => { continueAfterDriverReady(); };

        await startIntegrationFlow(cpfMasked, { autoStartTest: true });
      });
    }

    function updateModeAvailability() {
      const needsSheet = new Set(['LOAD']);
      document.querySelectorAll('.mode-btn').forEach(btn => {
        if (!btn.dataset.title) btn.dataset.title = btn.title || '';

        const mode = btn.dataset.mode;
        if (!mode) return;

        if (mode === 'DROP_HOOK') {
          const authorized = isDropDriverAuthorized(sessionDriver);
          btn.disabled = !authorized;
          btn.classList.toggle('opacity-50', !authorized);
          btn.classList.toggle('cursor-not-allowed', !authorized);
          btn.title = authorized
            ? 'CPF autorizado para Drop & Hook'
            : 'Drop & Hook bloqueado: liberação do ADMIN necessária';

          const arrow = btn.querySelector('.mode-arrow');
          if (arrow) arrow.textContent = authorized ? '›' : 'Bloq.';
          return;
        }

        if (needsSheet.has(mode)) {
          const disabled = !isSheetReady;
          btn.disabled = disabled;
          btn.classList.toggle('opacity-50', disabled);
          btn.classList.toggle('cursor-not-allowed', disabled);
          btn.title = disabled ? 'Planilha não carregou ainda.' : (btn.dataset.title || '');

          const arrow = btn.querySelector('.mode-arrow');
          if (arrow) arrow.textContent = disabled ? 'Indisp.' : '›';
        }
      });
    }

    async function loadIntegrationDoc(cpf) {
      const cacheKey = `heilog-integration-${cpf}`;
      const ref = doc(db, 'artifacts', appId, 'public', 'data', 'integrations', cpf);
      try {
        const snap = await getDoc(ref);
        if (snap.exists()) {
          const data = snap.data();
          try { localStorage.setItem(cacheKey, JSON.stringify(data)); } catch {}
          return data;
        }
      } catch (e) {
        console.warn("Falha ao ler integration doc:", e);
      }

      try {
        const cached = localStorage.getItem(cacheKey);
        if (cached) return JSON.parse(cached);
      } catch {}
      return null;
    }

    async function saveIntegrationDoc(cpf, patch) {
      const ref = doc(db, 'artifacts', appId, 'public', 'data', 'integrations', cpf);
      await setDoc(ref, patch, { merge: true });
      try {
        const current = await loadIntegrationDoc(cpf) || {};
        const merged = { ...current, ...patch };
        localStorage.setItem(`heilog-integration-${cpf}`, JSON.stringify(merged));
      } catch {}
    }

    function computeIntegrationStatus(docData) {
      const now = new Date();
      if (!docData || !docData.nextDueAt) {
        return { state: 'NEW', now };
      }
      const due = toDateMaybe(docData.nextDueAt);
      if (!due) return { state: 'NEW', now };

      const warn = addDays(now, INTEGRATION_WARN_DAYS);
      if (now > due) return { state: 'EXPIRED', now, due };
      if (warn >= due) return { state: 'EXPIRING', now, due };
      return { state: 'VALID', now, due };
    }

    function isIntegrationAccepted(state) {
      return state === 'VALID' || state === 'EXPIRING';
    }

    async function getIntegrationStateForCpf(cpfDigits) {
      const cpf = normalizeDigits(cpfDigits);
      if (cpf.length !== 11) return { ok: false, state: 'INVALID' };

      const data = await loadIntegrationDoc(cpf);
      const status = computeIntegrationStatus(data);
      const due = status.due || null;

      const ok = isIntegrationAccepted(status.state);
      return { ok, state: status.state, due, data };
    }

    function formatDateBR(d) {
      try { return d ? d.toLocaleDateString('pt-BR') : ''; } catch { return ''; }
    }

    async function renderIntegrationStatus(cpf) {
      const host = document.getElementById('int-status');
      if (!host) return;

      host.innerHTML = `<div class="text-xs text-gray-300">Consultando status...</div>`;

      const data = await loadIntegrationDoc(cpf);
      const status = computeIntegrationStatus(data);

      let driverName = '';
      try {
        const driverRef = doc(db, 'artifacts', appId, 'public', 'data', 'drivers', cpf);
        const snap = await getDoc(driverRef);
        if (snap.exists()) driverName = (snap.data().name || '');
      } catch {}

      const fmt = (d) => d ? d.toLocaleDateString('pt-BR') : '—';
      const dueTxt = status.due ? fmt(status.due) : '—';

      let badge = '';
      let msg = '';
      if (status.state === 'NEW') {
        badge = `<span class="px-2 py-1 rounded bg-blue-600/70 text-white text-xs font-bold">NÃO REALIZADO</span>`;
        msg = `Precisa realizar o teste.`;
      } else if (status.state === 'EXPIRED') {
        badge = `<span class="px-2 py-1 rounded bg-red-600/70 text-white text-xs font-bold">VENCIDO</span>`;
        msg = `Integração venceu em <strong>${dueTxt}</strong>. Precisa refazer.`;
      } else if (status.state === 'EXPIRING') {
        badge = `<span class="px-2 py-1 rounded bg-yellow-500/70 text-black text-xs font-bold">VAI VENCER</span>`;
        msg = `Integração vence em <strong>${dueTxt}</strong> (faltam poucos dias).`;
      } else {
        badge = `<span class="px-2 py-1 rounded bg-green-600/70 text-white text-xs font-bold">VÁLIDO</span>`;
        msg = `Integração válida até <strong>${dueTxt}</strong>.`;
      }

      const lastScore = data?.lastScore ?? '—';
      const lastApprovedAt = toDateMaybe(data?.lastApprovedAt);
      const lastApprovedTxt = lastApprovedAt ? fmt(lastApprovedAt) : '—';
      const lastScoreNum = (typeof data?.lastScore === 'number') ? data.lastScore : parseInt(data?.lastScore, 10);
      const canRepeat = Number.isFinite(lastScoreNum) && lastScoreNum < INTEGRATION_MIN_SCORE;
      const showStartBtn = !(status.state === 'VALID' || status.state === 'EXPIRING');
      const startLabel = canRepeat ? 'Repetir teste' : 'Fazer teste';

      host.innerHTML = `
        <div class="bg-black/25 border border-white/10 rounded-xl p-4 space-y-2">
          <div class="flex items-center justify-between gap-2">
            <div class="text-sm font-bold text-white">CPF: ${cpf}</div>
            ${badge}
          </div>
          ${driverName ? `<div class="text-xs text-gray-200">Motorista: <strong>${driverName}</strong></div>` : ''}
          <div class="text-sm text-gray-200">${msg}</div>

          <div class="grid grid-cols-2 gap-2 text-xs text-gray-200 pt-2">
            <div class="bg-white/5 rounded-lg p-2"><div class="text-gray-400">Última aprovação</div><div class="font-bold">${lastApprovedTxt}</div></div>
            <div class="bg-white/5 rounded-lg p-2"><div class="text-gray-400">Última nota</div><div class="font-bold">${lastScore}</div></div>
          </div>

          <div class="flex gap-2 pt-2">
            ${showStartBtn ? `<button id="int-start" class="btn-green flex-1 py-2 rounded-lg">${startLabel}</button>` : ``}
            <button id="int-history" class="${showStartBtn ? 'btn-ghost flex-1 py-2 rounded-lg' : 'btn-ghost w-full py-2 rounded-lg'}">Histórico</button>
          </div>

          <div id="int-subview" class="pt-2"></div>
        </div>
      `;

      document.getElementById('int-start')?.addEventListener('click', async () => {
        await unlockAudio();
        renderIntegrationTest(cpf);
      });

      document.getElementById('int-history')?.addEventListener('click', async () => {
        await unlockAudio();
        renderIntegrationHistory(cpf);
      });
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function renderIntegrationTest(cpf) {
      const sub = document.getElementById('int-subview');
      if (!sub) return;

      const qOrder = shuffle(integrationQuestions.map((q, idx) => ({ ...q, _id: idx })));

      sub.innerHTML = `
        <div class="bg-blue-900/30 border border-blue-700 rounded-xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <div class="text-white font-bold">Teste de Integração</div>
            <button id="int-cancel" class="btn-ghost px-3 py-1 rounded-lg text-xs">Fechar</button>
          </div>

          <form id="int-form" class="space-y-3">
            ${qOrder.map((q, i) => `
              <div class="bg-black/20 border border-white/10 rounded-xl p-3">
                <div class="text-sm font-semibold text-white mb-2">${i+1}. ${q.q}</div>
                <div class="space-y-2 text-sm text-gray-200">
                  ${q.options.map((opt, oi) => `
                    <label class="flex items-start gap-2 cursor-pointer">
                      <input type="radio" name="q_${i}" value="${oi}" class="mt-1">
                      <span>${opt}</span>
                    </label>
                  `).join('')}
                </div>
              </div>
            `).join('')}

            <button type="submit" class="btn-green w-full py-3 rounded-lg">Finalizar</button>
          </form>

          <div id="int-result" class="pt-2"></div>
        </div>
      `;

      document.getElementById('int-cancel')?.addEventListener('click', () => {
        sub.innerHTML = '';
      });

      document.getElementById('int-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();

        const form = e.target;
        const answers = [];
        for (let i = 0; i < qOrder.length; i++) {
          const picked = form.querySelector(`input[name="q_${i}"]:checked`);
          if (!picked) {
            displayError("Responda todas as perguntas antes de finalizar.", 4000);
            return;
          }
          answers.push(parseInt(picked.value, 10));
        }

        let score = 0;
        for (let i = 0; i < qOrder.length; i++) {
          if (answers[i] === qOrder[i].correctIndex) score++;
        }

        const passed = score >= INTEGRATION_MIN_SCORE;
        const now = new Date();
        const nextDue = addDays(now, INTEGRATION_VALID_DAYS);

        const attempt = {
          id: generateInternalId('ATT'),
          at: now.toISOString(),
          score,
          total: qOrder.length,
          passed,
        };

        try {
          const current = await loadIntegrationDoc(cpf) || {};
          const prevAttempts = Array.isArray(current.attempts) ? current.attempts : [];
          const attempts = [attempt, ...prevAttempts].slice(0, 30);
          const patch = {
            cpf,
            lastAttemptAt: now.toISOString(),
            lastScore: score,
            attempts,
          };
          if (passed) {
            patch.lastApprovedAt = now.toISOString();
            patch.nextDueAt = nextDue.toISOString();
            patch.lastPassed = true;
          } else {
            patch.lastPassed = false;
          }

          await saveIntegrationDoc(cpf, patch);

          const resultEl = document.getElementById('int-result');
          if (resultEl) {
            resultEl.innerHTML = passed
              ? `<div class="bg-green-600/20 border border-green-500 text-green-100 p-3 rounded-lg">
                   <div class="font-bold">APROVADO ✅</div>
                   <div>Sua nota: <strong>${score}/${qOrder.length}</strong>. Válido até <strong>${nextDue.toLocaleDateString('pt-BR')}</strong>.</div>
                 </div>`
              : `<div class="bg-red-600/20 border border-red-500 text-red-100 p-3 rounded-lg">
                   <div class="font-bold">REPROVADO ❌</div>
                   <div>Sua nota: <strong>${score}/${qOrder.length}</strong>. Você pode tentar novamente.</div>
                 </div>`;
          }

          if (passed && typeof postIntegrationNavigate === 'function') {
            const cb = postIntegrationNavigate;
            postIntegrationNavigate = null;
            setTimeout(() => { try { cb(); } catch {} }, 300);
            return;
          }

          await renderIntegrationStatus(cpf);
        } catch (err) {
          console.error("Falha ao salvar tentativa:", err);
          displayError("Não consegui salvar a tentativa no Firestore. Verifique permissões/regras.", 6000);
        }
      });
    }

    function performSearchByDt(query) {
      const q = query.trim();
      if (!q) { displayError("Digite um número de DT para buscar."); return; }
      if (database.length === 0) { displayError("Os dados da planilha ainda não foram carregados."); return; }

      const results = database.filter(row => (row[headerMap.dts] || '').toString().trim().toLowerCase() === q.toLowerCase());
      if (results.length > 0) {
        const deposito = results[0][headerMap.deposito] || '';
        const normalizedDeposito = deposito.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        if (normalizedDeposito.includes('FABRICA')) {
          showDriverForm(results, { modeLabel: (requireUnloadDtInForm ? 'Carregamento + Descarga' : 'Carregamento'), isManualOverride: false });
        } else {
          displayStandardResults(results);
        }
      } else {
        displayNotFound(q);
      }
    }

              <div class="mt-3 space-y-2">

            </details>
          ` : `
            <input type="text" id="invoice-number" class="form-input" hidden>
            <input type="text" id="unload-dt" class="form-input" hidden>
          `}

          <div class="sticky-actions">
            <button id="generate-sheet-btn" class="btn-green w-full py-5 rounded-2xl text-xl font-extrabold">

      `;

      document.getElementById('back-from-form')?.addEventListener('click', () => {
        if (currentMode) renderModeForm(currentMode);
        else renderActionSelector();
        resultsArea.innerHTML = '';
      });

      applyFormMasksAndValidations();

      const driverCpfEl = document.getElementById('driver-cpf');
      if (driverCpfEl && sessionCpf) {
        driverCpfEl.value = sessionCpf;
        if (cpfMask) cpfMask.unmaskedValue = normalizeDigits(sessionCpf);
      }
      if (sessionDriver) fillFormFields(sessionDriver);

      if ((isDropHookFlow && dropHookQuickMode) || baldeioQuickMode) {
        document.getElementById('driver-cpf')?.closest('.section')?.classList.add('hidden');
        document.getElementById('driver-name')?.closest('.section')?.classList.add('hidden');
        document.getElementById('manual-type')?.closest('details')?.classList.add('hidden');
        document.getElementById('driver-renavam')?.closest('details')?.classList.add('hidden');

        const cnhEl = document.getElementById('driver-cnh');
        const axlesEl = document.getElementById('truck-axles');
        vehicleTypeEl?.classList.add('hidden');
        vehicleTypeEl?.nextElementSibling?.classList.add('hidden');
        cnhEl?.closest('.grid')?.classList.add('hidden');
        cnhEl?.closest('.grid')?.nextElementSibling?.classList.add('hidden');

        const printButton = document.getElementById('generate-sheet-btn');
        if (printButton) printButton.textContent = '✅ Confirmar placas e finalizar';

        if (printHelp) printHelp.textContent = 'Confira a placa do cavalo e da carreta antes de finalizar.';

        // No Drop & Hook, o formulário principal representa o Motorista Viagem.
        if (cpfMask) cpfMask.unmaskedValue = normalizeDigits(dropHookManeuverCpf || '');
        else if (driverCpfEl) driverCpfEl.value = dropHookManeuverCpf || '';
        fillFormFields(dropHookManeuverDriver);
        dropHookManeuverPlate = sanitizePlate(dropHookManeuverPlate || dropHookTripDriver?.truckPlate || sessionDriver?.truckPlate || '');
      }

      if (isManual) {
        const manualTypeEl = document.getElementById('manual-type');
        const manualClientEl = document.getElementById('manual-client');
        const manualPltEl = document.getElementById('manual-plt');

        if (manualTypeEl && manualPresetType) manualTypeEl.value = manualPresetType;
        if (manualClientEl && hideManualExtras && !manualClientEl.value) manualClientEl.value = 'N/A';
        if (manualPltEl && hideManualExtras && !manualPltEl.value) manualPltEl.value = '';
      }

      const manualTypeEl2 = document.getElementById('manual-type');
      const manualTypeHelp = document.getElementById('manual-type-help');
      const explainType = (val) => {
        const v = (val || '').toString().toUpperCase().trim();
        if (!v) return 'Dica: se não tiver certeza, deixe em branco.';
        if (v.includes('BULK')) return 'Bulk: carga a granel (sem pallet).';
        if (v.includes('EMBALAGEM')) return 'Embalagem: material de embalagem (ex.: caixas, tampas, etc.).';
        if (v.includes('PALETES')) return 'Paletes Vazio: devolução/retorno de paletes vazios.';
        if (v.includes('LATAS VAZIAS') || v === 'LATAS') return 'Latas Vazias: retorno/recebimento de latas vazias (sem DT).';
        if (v.includes('PRODUTO ACABADO')) return 'Produto Acabado: cerveja pronta/paletizada.';
        if (v.includes('INSUMO')) return 'Insumo: matéria-prima/insumo para produção.';
        if (v.includes('BALDEIO') || v.includes('RITMO')) return 'Baldeio: transferência/ajuste de fluxo (DT opcional).';
        if (v.includes('DESCARGA')) return 'Descarga: recebimento/descarregamento.';
        if (v.includes('HIDROMAN')) return 'HIDROMAN: operação dedicada (sem planilha).';
        return 'Tipo selecionado.';
      };
      if (manualTypeEl2 && manualTypeHelp) {
        manualTypeHelp.textContent = explainType(manualTypeEl2.value);
        manualTypeEl2.addEventListener('change', () => {
          manualTypeHelp.textContent = explainType(manualTypeEl2.value);
        });
      }

      const driverTranspEl = document.getElementById('driver-transportadora');
      if (driverTranspEl && !driverTranspEl.value) {
        const fromSheet = (firstResult?.[headerMap.transportadora] || '').toString();
        driverTranspEl.value = fromSheet;
      }

      if (driverTranspEl && presetTransportadora) {
        driverTranspEl.value = presetTransportadora;
      }
      if (driverTranspEl) {
        driverTranspEl.readOnly = !!lockTransportadora;
        if (lockTransportadora) {
          driverTranspEl.classList.add('opacity-80');
        } else {
          driverTranspEl.classList.remove('opacity-80');
        }
      }

      const unloadEl = document.getElementById('unload-dt');
      if (unloadEl && pendingUnloadDt) unloadEl.value = pendingUnloadDt;

      if (sessionDriver) {
        const autoInfo = document.createElement('div');
        autoInfo.className = 'form-hint-box text-sm text-gray-200';
        autoInfo.innerHTML = `<b>Cadastro reaproveitado:</b> dados principais preenchidos automaticamente.`;
        resultsArea.firstElementChild?.appendChild(autoInfo);
      }

      document.getElementById('driver-cpf')?.addEventListener('input', findAndFillDriverData);

      const _intCpfEl = document.getElementById('driver-cpf');
      const _intStatusEl = document.getElementById('driver-int-status');
      const _intBadgeEl = document.getElementById('driver-int-badge');
      const _intOpenBtn = document.getElementById('driver-int-open');
      const _printBtn = document.getElementById('generate-sheet-btn');

      const setPrintEnabled = (enabled) => {
        if (!_printBtn) return;
        _printBtn.disabled = !enabled;
        _printBtn.classList.toggle('opacity-50', !enabled);
        _printBtn.classList.toggle('cursor-not-allowed', !enabled);
        if (!enabled) _printBtn.title = 'Integração obrigatória';
        else _printBtn.title = '';
      };

      let _intTimer = null;
      const refreshIntegrationUI = async () => {
        if (!_intCpfEl || !_intStatusEl || !_intBadgeEl) return;
        const cpfDigits = normalizeDigits(_intCpfEl.value);

        if (cpfDigits.length !== 11) {
          _intBadgeEl.textContent = '—';
          _intStatusEl.textContent = 'Digite o CPF completo para verificar.';
          if (_intOpenBtn) _intOpenBtn.classList.add('hidden');
          setPrintEnabled(false);
          return;
        }

        _intBadgeEl.textContent = '...';
        _intStatusEl.textContent = 'Verificando integração...';

        try {
          const st = await getIntegrationStateForCpf(cpfDigits);

          if (st.state === 'INVALID') {
            _intBadgeEl.textContent = 'CPF';
            _intStatusEl.textContent = 'CPF inválido.';
            if (_intOpenBtn) _intOpenBtn.classList.add('hidden');
            setPrintEnabled(false);
            return;
          }

          if (st.ok) {
            const dueTxt = st.due ? formatDateBR(st.due) : '';
            _intBadgeEl.textContent = (st.state === 'EXPIRING') ? 'ALERTA' : 'OK';
            _intStatusEl.textContent = st.state === 'EXPIRING'
              ? `Integração OK (vence em ${dueTxt}).`
              : `Integração OK (até ${dueTxt}).`;
            if (_intOpenBtn) _intOpenBtn.classList.add('hidden');
            setPrintEnabled(true);
          } else {
            const dueTxt = st.due ? formatDateBR(st.due) : '';
            _intBadgeEl.textContent = 'BLOQUEADO';
            _intStatusEl.textContent = st.state === 'EXPIRED'
              ? `Vencida em ${dueTxt}. Faça o teste para liberar.`
              : 'Não encontrada. Faça o teste para liberar.';
            if (_intOpenBtn) _intOpenBtn.classList.remove('hidden');
            setPrintEnabled(false);
          }
        } catch (e) {
          console.warn('Falha ao verificar integração:', e);
          _intBadgeEl.textContent = 'ERRO';
          _intStatusEl.textContent = 'Falha ao verificar. Tente novamente (ou faça o teste).';
          if (_intOpenBtn) _intOpenBtn.classList.remove('hidden');
          setPrintEnabled(false);
        }
      };

      if (_intCpfEl) {
        _intCpfEl.addEventListener('input', () => {
          if (_intTimer) clearTimeout(_intTimer);
          _intTimer = setTimeout(refreshIntegrationUI, 350);
        });
        _intCpfEl.addEventListener('blur', refreshIntegrationUI);
      }

      if (_intOpenBtn) {
        _intOpenBtn.addEventListener('click', async () => {
          await unlockAudio();
          const cpfMasked = _intCpfEl?.value || '';
          currentMode = 'INTEGRACAO';
          renderModeForm('INTEGRACAO');
          setTimeout(() => {
            const intCpf = document.getElementById('int-cpf');
            if (intCpf) intCpf.value = cpfMasked;
            document.getElementById('int-check')?.click();
          }, 0);
        });
      }

      setTimeout(refreshIntegrationUI, 0);

      document.getElementById('generate-sheet-btn')?.addEventListener('click', () => {
        unlockAudio();
        generateAndPrintSheet(dataArray, { isManual });
      });
    }

    function applyFormMasksAndValidations() {
      const cpfEl = document.getElementById('driver-cpf');
      if (cpfEl) cpfMask = IMask(cpfEl, { mask: '000.000.000-00' });

      const phoneEl = document.getElementById('driver-phone');
      if (phoneEl) phoneMask = IMask(phoneEl, { mask: '(00) 00000-0000' });

      const cnhExpiryEl = document.getElementById('cnh-expiry');
      if (cnhExpiryEl) IMask(cnhExpiryEl, { mask: '00/00/0000' });

      const cnhEl = document.getElementById('driver-cnh');
      if (cnhEl) {
        cnhEl.addEventListener('input', (e) => {
          e.target.value = e.target.value.replace(/\D/g, '').slice(0, 11);
          e.target.classList.remove('invalid');
        });
      }

      const applyPlateMask = (el) => {
        if (!el) return;
        el.addEventListener('input', (e) => {
          e.target.value = sanitizePlate(e.target.value);
          e.target.classList.remove('invalid');
        });
      };

      applyPlateMask(document.getElementById('truck-plate'));
      applyPlateMask(document.getElementById('trailer-plate'));

      document.querySelectorAll('.form-input, .form-select').forEach((el) => {
        el.addEventListener('input', () => el.classList.remove('invalid'));
        el.addEventListener('change', () => el.classList.remove('invalid'));
      });
    }

    function fillFormFields(data) {
      document.getElementById('driver-name').value = data.name || '';
      document.getElementById('driver-cnh').value = data.cnh || '';
      document.getElementById('cnh-expiry').value = data.cnhExpiry || '';
      document.getElementById('truck-plate').value = sanitizePlate(data.truckPlate || '');
      document.getElementById('trailer-plate').value = sanitizePlate(data.trailerPlate || '');
      document.getElementById('truck-axles').value = data.axles || '';
      const vehicleTypeEl = document.getElementById('vehicle-type');
      if (vehicleTypeEl) vehicleTypeEl.value = data.vehicleType || '';
      document.getElementById('driver-renavam').value = data.renavam || '';

      const transpEl = document.getElementById('driver-transportadora');
      if (transpEl && data.transportadora) transpEl.value = data.transportadora;

      if (phoneMask && data.phone) phoneMask.unmaskedValue = normalizeDigits(data.phone);
      else if (document.getElementById('driver-phone') && data.phone) document.getElementById('driver-phone').value = data.phone;
    }

    function validateField(element, errorMessage, condition = () => element.value.trim() !== '') {
      if (!element) return false;
      if (!condition()) {
        element.classList.add('invalid');
        displayError(errorMessage, 5000, { field: element });
        try { element.focus(); } catch {}
        scrollToField(element);
        return false;
      }
      element.classList.remove('invalid');
      return true;
    }

    function openPlateConfirmModal(truckPlate, trailerPlate, summary = {}) {
      return new Promise((resolve) => {
        const plateConfirmOverlay = document.getElementById('plate-confirm-overlay');
        const confirmTruckPlate = document.getElementById('confirm-truck-plate');
        const confirmTrailerPlate = document.getElementById('confirm-trailer-plate');
        const confirmManeuverPlateLine = document.getElementById('confirm-maneuver-plate-line');
        const confirmManeuverPlate = document.getElementById('confirm-maneuver-plate');
        const confirmSummary = document.getElementById('confirm-operation-summary');
        const plateConfirmEditBtn = document.getElementById('plate-confirm-edit-btn');
        const plateConfirmPrintBtn = document.getElementById('plate-confirm-print-btn');
        const plateConfirmHomeBtn = document.getElementById('plate-confirm-home-btn');

        if (
          !plateConfirmOverlay ||
          !confirmTruckPlate ||
          !confirmTrailerPlate ||
          !confirmSummary ||
          !plateConfirmEditBtn ||
          !plateConfirmPrintBtn ||
          !plateConfirmHomeBtn
        ) {
          console.error('Modal de confirmação das placas não encontrado no DOM.');
          resolve({ confirmed: true, truckPlate: sanitizePlate(truckPlate), trailerPlate: sanitizePlate(trailerPlate), maneuverPlate: sanitizePlate(summary?.placaManobra || dropHookManeuverPlate || '') });
          return;
        }

        const truckInitial = sanitizePlate(truckPlate || '');

          buildSummaryItem('Cavalo', summary.cavalo),
