        ].join('');

          });
        };
        applyPlateInput(truckInput);
        applyPlateInput(trailerInput);
        applyPlateInput(maneuverInput);

        plateConfirmOverlay.style.display = 'flex';
        setTimeout(() => truckInput?.focus(), 50);

        const cleanup = () => {
          plateConfirmOverlay.style.display = 'none';
          plateConfirmEditBtn.onclick = null;
          plateConfirmPrintBtn.onclick = null;
          plateConfirmHomeBtn.onclick = null;
          plateConfirmOverlay.onclick = null;
          document.removeEventListener('keydown', escHandler);
        };

        const escHandler = (e) => {
          if (e.key === 'Escape') {
            cleanup();
            resolve({ confirmed: false });
          }
        };

        plateConfirmEditBtn.onclick = () => {
          cleanup();
          resolve({ confirmed: false });
        };

        plateConfirmHomeBtn.onclick = () => {
          cleanup();
          resolve({ confirmed: false });
          returnToInitialScreen(false);
        };

        plateConfirmPrintBtn.onclick = () => {
          const nextTruck = sanitizePlate(truckInput?.value || '');
          const nextTrailer = sanitizePlate(trailerInput?.value || '');
          const nextManeuver = sanitizePlate(maneuverInput?.value || '');

          if (!isValidBrazilianPlate(nextTruck)) {
            truckInput?.classList.add('invalid');
            truckInput?.focus();
            return;
          }

          if (nextTrailer && !isValidBrazilianPlate(nextTrailer)) {
            trailerInput?.classList.add('invalid');
            trailerInput?.focus();
            return;
          }

          if (summary.isDropHook && nextManeuver && !isValidBrazilianPlate(nextManeuver)) {
            maneuverInput?.classList.add('invalid');
            maneuverInput?.focus();
            return;
          }

          cleanup();
          resolve({ confirmed: true, truckPlate: nextTruck, trailerPlate: nextTrailer, maneuverPlate: nextManeuver });
        };

        plateConfirmOverlay.onclick = (e) => {
          if (e.target === plateConfirmOverlay) {
            cleanup();
            resolve({ confirmed: false });
          }
        };

        document.addEventListener('keydown', escHandler);
      });
    }

    async function waitForRasterAssets(root) {
      if (!root) return;

      const imgs = Array.from(root.querySelectorAll('img'));
      await Promise.all(imgs.map(img => {
        if (img.complete) return Promise.resolve();
        return new Promise(resolve => {
          const done = () => resolve();
          img.addEventListener('load', done, { once: true });
          img.addEventListener('error', done, { once: true });
        });
      }));

      await new Promise(resolve =>
        requestAnimationFrame(() => requestAnimationFrame(resolve))
      );
    }

    function makePureMonochromeCanvas(sourceCanvas) {
      const output = document.createElement('canvas');
      output.width = sourceCanvas.width;
      output.height = sourceCanvas.height;

      const ctx = output.getContext('2d', { willReadFrequently: true });
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, output.width, output.height);
      ctx.drawImage(sourceCanvas, 0, 0);

      const image = ctx.getImageData(0, 0, output.width, output.height);
      const d = image.data;

      for (let i = 0; i < d.length; i += 4) {
        const a = d[i + 3] / 255;
        const r = d[i] * a + 255 * (1 - a);
        const g = d[i + 1] * a + 255 * (1 - a);
        const b = d[i + 2] * a + 255 * (1 - a);

        // Escala de cinza real, com contraste suavizado.
        // Não usa cores e não "estoura" texto/bordas como o threshold 1-bit.
        let gray = Math.round(0.299 * r + 0.587 * g + 0.114 * b);

        // Suaviza os pretos muito fortes sem apagar linhas finas.
        if (gray < 70) gray = 45;
        else if (gray < 150) gray = Math.round(gray * 0.88 + 18);
        else if (gray > 235) gray = 255;

        d[i] = gray;
        d[i + 1] = gray;
        d[i + 2] = gray;
        d[i + 3] = 255;
      }

      ctx.putImageData(image, 0, 0);
      return output;
    }

    function fitCanvasIntoA4(sourceCanvas) {
      // Proporção da área útil A4: 198 x 282 mm.
      // Resolução interna suficiente para texto e linhas ficarem nítidos.
      const TARGET_W = 1584;
      const TARGET_H = 2256;

      const target = document.createElement('canvas');
      target.width = TARGET_W;
      target.height = TARGET_H;

      const ctx = target.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, TARGET_W, TARGET_H);

      // Escala uniforme: NUNCA distorce largura/altura.
      const scale = Math.min(
        TARGET_W / sourceCanvas.width,
        TARGET_H / sourceCanvas.height
      ) * 0.985;

      const drawW = Math.round(sourceCanvas.width * scale);
      const drawH = Math.round(sourceCanvas.height * scale);
      const x = Math.round((TARGET_W - drawW) / 2);
      const y = 10;

      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(sourceCanvas, 0, 0, sourceCanvas.width, sourceCanvas.height,
                    x, y, drawW, drawH);

      return target;
    }

    async function rasterizePrintableAreaForLexmark() {
      const printableArea = document.getElementById('printable-area');
      if (!printableArea || !window.html2canvas) return false;

      await waitForRasterAssets(printableArea);

      // Considera como página todo filho que não seja apenas quebra de página.
      const pages = Array.from(printableArea.children).filter(el =>
        el.nodeType === 1 &&
        !el.classList.contains('print-page-break') &&
        getComputedStyle(el).display !== 'none'
      );

      if (!pages.length) return false;

      const rasterContainer = document.createElement('div');
      rasterContainer.id = 'rasterized-printable-area';

      // Stage A4 fora da tela.
      const stage = document.createElement('div');
      stage.style.position = 'fixed';
      stage.style.left = '-30000px';
      stage.style.top = '0';
      stage.style.width = '198mm';
      stage.style.background = '#fff';
      stage.style.color = '#000';
      stage.style.pointerEvents = 'none';
      stage.style.zIndex = '-99999';

      document.body.appendChild(stage);

      try {
        for (const originalPage of pages) {
          const clone = originalPage.cloneNode(true);

          // Mantém todo o HTML/CSS original.
          // Só neutraliza posicionamento externo para capturar.
          clone.style.position = 'relative';
          clone.style.left = '0';
          clone.style.top = '0';
          clone.style.margin = '0';
          clone.style.width = '100%';
          clone.style.maxWidth = 'none';

          stage.innerHTML = '';
          stage.appendChild(clone);

          await waitForRasterAssets(stage);

          const sourceCanvas = await html2canvas(clone, {
            backgroundColor: '#ffffff',
            scale: 2,
            useCORS: true,
            allowTaint: true,
            logging: false,
            imageTimeout: 0,
            removeContainer: true,
            width: clone.scrollWidth,
            height: clone.scrollHeight,
            windowWidth: clone.scrollWidth,
            windowHeight: clone.scrollHeight
          });

          // Primeiro preserva o layout inteiro e encaixa proporcionalmente em A4.
          const fittedCanvas = fitCanvasIntoA4(sourceCanvas);

          // Depois converte a página pronta para P&B puro.
          const monoCanvas = makePureMonochromeCanvas(fittedCanvas);

          const img = document.createElement('img');
          img.src = monoCanvas.toDataURL('image/png');
          img.alt = 'Página A4 para impressão';
          img.decoding = 'sync';

          const page = document.createElement('div');
          page.className = 'raster-a4-page';
          page.appendChild(img);
          rasterContainer.appendChild(page);
        }
      } finally {
        stage.remove();
      }

      printableArea.innerHTML = '';
      printableArea.appendChild(rasterContainer);

      await waitForRasterAssets(printableArea);
      return true;
    }

                  <td style="border:1px solid #cfcfcf; padding:7px 7px;">Analista</td>
                  <td style="border:1px solid #cfcfcf; padding:7px 7px; text-align:center;">Analista</td>
                  <td style="border:1px solid #cfcfcf; padding:7px 7px;"></td>
                  <td style="border:1px solid #cfcfcf; padding:7px 7px;"></td>
                </tr>
              </tbody>
            </table>
          </section>
          `}

          <section style="border:2px solid #111; margin-bottom:6px;">
            <div style="
  background:#e5e5e5 !important;
  color:#000 !important;
  border-top:2px solid #111;
  border-bottom:2px solid #111;
  padding:8px 10px;
  font-size:15px;
  font-weight:900;
  text-align:center;
  letter-spacing:.12em;
  text-transform:uppercase;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
">
  REGRAS DE SEGURANÇA
</div>
            <ul style="font-size:12px; line-height:1.32; padding:7px 12px 7px 20px; margin:0;">
              <li>- Proibido o uso de adornos.</li>
              <li>- Obrigatório o uso de todos os EPIs: capacete com jugular, bota de segurança, colete refletivo, óculos de segurança, luvas e máscara quando aplicável.</li>
              <li>- Obrigatório o uso das faixas de pedestres.</li>
              <li>- Obrigatória distância de 5m entre pessoas e empilhadeiras.</li>
              <li>- Respeitar os procedimentos HEINEKEN, colaboradores e Segurança Patrimonial.</li>
            </ul>
          </section>

          ${dropHookSimpleTermHtml}

          <section style="border:2px solid #111; padding:5px 9px;">
            <div style="font-size:12px; font-weight:900; margin-bottom:6px;">★ HEINEKEN UNIDADE JACAREÍ</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; column-gap:22px; font-size:10.8px; line-height:1.34;">
              <div>
                <p><strong>DATA:</strong> ${printDate}</p>
                <p><strong>${isDropHookPrint ? 'MOTORISTA VIAGEM' : 'MOTORISTA'}:</strong> ${isDropHookPrint ? (driverData.motoristaViagem?.nome || driverData.name || '') : (driverData.name || '')}</p>
                ${isDropHookPrint ? `<p><strong>MOTORISTA MANOBRA:</strong> ${driverData.motoristaManobra?.nome || ''}</p>` : ''}
                <p><strong>TELEFONE:</strong> ${driverData.phone}</p>
                <p><strong>PLACA 1:</strong> ${driverData.truckPlate}</p>
                <p><strong>NOTA FISCAL:</strong> ${driverData.invoice || ''}</p>
              </div>
              <div>
                <p><strong>HORA CHEGADA:</strong> ${printTime}</p>
                <p><strong>CPF:</strong> ${driverData.cpf}</p>
                <p><strong>EMPRESA:</strong> ${companyPrint}</p>
                <p><strong>OPERAÇÃO:</strong> ${operationTag || ''}</p>
                <p><strong>PLACA 2:</strong> ${driverData.trailerPlate || ''}</p>
              </div>
            </div>
          </section>
        </div>

        ${dropHookHtml}
        ${checklistHtml}
      `;
    }

function showCallPanel(driverName, isAlert) {
      clearTimeout(panelTimeout);
      callPanelMessage.innerHTML = `Por favor ${driverName},<br>Se Apresente ao ATO!`;

      if (isAlert) {
        callPanelContent.style.backgroundColor = '#fecaca';
        playSound(true);
      } else {
        callPanelContent.style.backgroundColor = '#e5e7eb';
        playSound(false);
      }

      callPanelOverlay.style.display = 'flex';
      panelTimeout = setTimeout(resetApp, 7000);
    }

    function playSound(isPrioritySound) {
      if (!audioUnlocked) return;
      const synth = new Tone.Synth().toDestination();
      if (isPrioritySound) {
        synth.triggerAttackRelease("C5", "8n", Tone.now());
        synth.triggerAttackRelease("G5", "8n", Tone.now() + 0.2);
      } else {
        synth.triggerAttackRelease("C4", "8n", Tone.now());
      }
    }

    function resetApp() {
      callPanelOverlay.style.display = 'none';
      const plateConfirmOverlay = document.getElementById('plate-confirm-overlay');
      if (plateConfirmOverlay) plateConfirmOverlay.style.display = 'none';
      resultsArea.innerHTML = '';
      try { actionArea.innerHTML = ''; } catch {}

      sessionCpf = '';
      sessionDriver = null;
      try { localStorage.removeItem('heilog-last-cpf'); } catch {}
      currentMode = null;
      pendingUnloadDt = '';
      requireUnloadDtInForm = false;
      manualPresetType = '';
      manualDtIdOverride = '';
      hideManualExtras = false;
      showUnloadInputs = true;
      loadAlsoUnload = false;
      presetTransportadora = '';
      lockTransportadora = false;
      selectedFlowKey = '';
      selectedFlowLabel = '';
      selectedFlowStep1 = '';
      selectedFlowStep2 = '';
      baldeioDtCarga = '';
      baldeioDtDescarga = '';
      isDropHookFlow = false;
      dropHookTripCpf = '';
      dropHookTripDriver = null;
      dropHookDtCarga = '';
      dropHookManeuverCpf = '';
      dropHookManeuverDriver = null;
      dropHookManeuverPlate = '';
      dropHookAlsoUnload = false;
      dropHookQuickMode = false;
      baldeioQuickMode = false;

      renderCpfGate();
      clearTimeout(panelTimeout);
    }

    function displayError(message, duration = 0, options = {}) {
      document.getElementById('temp-alert')?.remove();
      const alertDiv = document.createElement('div');
      alertDiv.id = 'temp-alert';
      alertDiv.className = 'error-card';
      alertDiv.innerHTML = `
        <div class="title">Não foi possível continuar</div>
        <div>${escapeHtml(message)}</div>
        <div class="tip">${escapeHtml(options.tip || deriveErrorTip(message))}</div>
      `;

      resultsArea.insertAdjacentElement('afterbegin', alertDiv);

      if (options.field) {
        try { options.field.classList.add('invalid'); } catch {}
        scrollToField(options.field);
      } else {
        try { alertDiv.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch {}
      }

      if (duration > 0) setTimeout(() => alertDiv.remove(), duration);
    }

    function displayNotFound(query) {
      resultsArea.innerHTML = `
        <div class="bg-yellow-900/50 border border-yellow-700 text-yellow-300 p-4 rounded-xl text-center">
          <p class="font-semibold">DT "${query}" não encontrada na planilha.</p>
          <p class="text-sm mt-2">Você pode continuar mesmo assim criando a folha manual.</p><button id="manual-form-btn" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-all">
            Criar Folha de Marcação Manual
          </button>
        </div>
      `;
      document.getElementById('manual-form-btn')?.addEventListener('click', async () => {
        await unlockAudio();
        manualPresetType = '';
        hideManualExtras = false;
        showUnloadInputs = !!loadAlsoUnload;
        presetTransportadora = '';
        lockTransportadora = false;
        baldeioDtCarga = '';
        baldeioDtDescarga = '';
        requireUnloadDtInForm = false;
        manualDtIdOverride = normalizeDtId(query) || generateInternalId('MANUAL');
        showDriverForm([{ [headerMap.dts]: manualDtIdOverride }], { modeLabel: 'Marcação Manual', isManualOverride: true });
      });
    }

    closePanelBtn.addEventListener('click', resetApp);
    callPanelOverlay.addEventListener('click', (e) => { if (e.target === callPanelOverlay) resetApp(); });
    window.addEventListener('load', initializeAppLogic);
  </script>
</body>
</html>
